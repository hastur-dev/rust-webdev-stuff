[package]
name = "knowledge-vault-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Secure knowledge management backend with Actix-web"
license = "MIT"

[dependencies]
# Web framework - single-threaded runtime
actix-web = "4.4"
actix-rt = "2.9"
actix-cors = "0.7"

# Async runtime (current_thread for 1 CPU constraint)
tokio = { version = "1.35", features = ["rt", "macros"] }

# Database
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
serde_yaml = "0.9"

# Security - Password hashing
argon2 = "0.5"

# Security - JWT
jsonwebtoken = "9.2"

# Security - Encryption (AES-256-GCM)
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"

# Random generation
rand = "0.8"
getrandom = "0.2"

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-actix-web = "0.7"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Validation
validator = { version = "0.16", features = ["derive"] }

# Cookie handling
actix-web-httpauth = "0.8"
cookie = { version = "0.18", features = ["secure"] }

# Async utilities
futures-util = "0.3"

[dev-dependencies]
actix-rt = "2.9"
tempfile = "3.9"
pretty_assertions = "1.4"
proptest = "1.4"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Link-time optimization
codegen-units = 1   # Single codegen unit for smaller binary
panic = "abort"     # Smaller binary, no unwinding
strip = true        # Strip symbols

[[bin]]
name = "knowledge-vault"
path = "src/main.rs"

[lib]
name = "knowledge_vault"
path = "src/lib.rs"
